<div class="base rubik">
  <div class="imagem-lateral"></div>
  <form class="form" [formGroup]="formularioRegister" (ngSubmit)="enviar()">
    <h2 class="title">Criar Usuario</h2>
    <div class="form-group">
      <label for="nome">Nome:</label>
      <input type="text" id="nome" formControlName="nome" autocomplete="nome" />
    </div>

    <div class="form-group">
      <label for="email">Email:</label>
      <input
        type="text"
        id="email"
        formControlName="email"
        autocomplete="email"
      />
    </div>

    <div class="form-group">
      <label for="password">Senha:</label>
      <input type="password" id="password" formControlName="password" />
    </div>
    <div
      *ngIf="getErroCampo('password')?.['passwordError'] && (formularioRegister.get('password')?.touched)"
    >
      A senha precisa de uma a-z, A-Z, 1-9 e um caracter especial
    </div>

    <div class="form-group">
      <label for="confirmPassword">Confirmar senha:</label>
      <input
        type="password"
        id="confirmPassword"
        formControlName="confirmPassword"
      />
    </div>
    <div *ngIf="formularioRegister.errors?.['passwordMismatch'] && submited">
      As senhas não coincidem.
    </div>

    <div class="button-div">
      <button type="submit">Sign Up</button>
    </div>
    <div class="criarconta">
      <p>Já tem usuário? <a href="">Log in</a></p>
    </div>
  </form>
</div>
