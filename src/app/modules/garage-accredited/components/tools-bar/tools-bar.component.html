<div class="screen">
  <div class="side-bar" (clickOutside)="fechar()" [ngClass]="{ open: open }">
    <button class="menu-bar" (click)="abrir()">
      <img src="../../../../../assets/images/menu-outline.svg" alt="" />
    </button>

    <ul class="acoes">
      <ng-container *ngIf="!open; else elseBlock">
        <div class="acoes-in acoes-close" @fadeInOut>
          <li (click)="meusLocais()">
            <img
              src="../../../../../assets/images/pin-sharp-circle-624-svgrepo-com.svg"
              alt="m"
            />
          </li>
          <li>
            <img
              src="../../../../../assets/images/bookmarks-outline.svg"
              alt="s"
            />
          </li>
        </div>
      </ng-container>
      <ng-template #elseBlock>
        <div class="acoes-in acoes-open" @fadeInOut>
          <li (click)="meusLocais()">
            <img
              src="../../../../../assets/images/pin-sharp-circle-624-svgrepo-com.svg"
              alt="m"
            />
            <p>Meus Locais</p>
          </li>
          <li>
            <img
              src="../../../../../assets/images/bookmarks-outline.svg"
              alt=""
            />
            <p>Locais Salvos</p>
          </li>
        </div>
      </ng-template>
    </ul>
  </div>

  <div class="overlay" *ngIf="openMeusLocais" (mouseup)="meusLocais()">
    <div class="adicionar-modal" (mouseup)="$event.stopPropagation()"></div>
  </div>

  <app-header class="header1 w-full" />
</div>

<!-- fazer que cuando o w seja menor a 600px a tools-bar se esconda -->
